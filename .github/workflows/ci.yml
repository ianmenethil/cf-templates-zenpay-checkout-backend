# Runs on every push to main and on every pull request. One job runs the steps below in order and stops at the first one that fails.
# They are the steps of `pnpm run check` plus the dependency audit, the type check and the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Installs exactly what pnpm-lock.yaml says and fails if the lockfile and package.json disagree. @zp-hcp/server comes from
      # Zenith's CDN (cdn.zenithpayments.support), so the runner needs to reach it.
      - run: pnpm install --frozen-lockfile
      # Fails when a dependency has a known security advisory.
      - name: No known vulnerabilities in dependencies
        run: pnpm audit
      # Fails when worker-configuration.d.ts does not match wrangler.jsonc. Fix it locally with `pnpm run cf-typegen`.
      - name: Generated types are up to date
        run: pnpm run typegen:check
      # Fails when a file is not formatted the way Prettier writes it. Fix it locally with `pnpm run format`.
      - name: Formatting
        run: pnpm run format:check
      - name: Lint (type-aware ESLint rules and TSDoc rules)
        run: pnpm run lint
      - name: Types
        run: pnpm exec tsc -b
      # The admin panel's component tests run in a real Chromium, which Playwright downloads itself.
      # `--with-deps` also installs the system libraries Chromium needs on the runner.
      - name: Browser for the component tests
        run: pnpm exec playwright install --with-deps chromium
      # Runs the three test projects: the Worker (in the Workers runtime), the panel's plain functions and the panel's components.
      - run: pnpm test
      - name: Build the Worker and the admin panel
        run: pnpm run build
      # Checks that wrangler.jsonc and the built Worker are valid for a deploy, without uploading anything.
      - name: Dry-run deploy
        run: pnpm exec wrangler deploy --dry-run
